<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học Flashcard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="sidebar-container" class="sidebar"></div>

    <div class="main-content">
      <h1 class="page-title">Học Flashcard 🧠</h1>

      <div style="text-align: center; margin-bottom: 30px">
        <label>Chọn chủ đề để học:</label>
        <select
          id="study-topic-select"
          style="max-width: 300px; margin: 0 auto"
          onchange="loadCards()"
        >
          <option value="all">Tất cả chủ đề</option>
        </select>
      </div>

      <!-- Khu vực hiển thị Flashcard -->
      <div id="study-area" style="display: none">
        <div class="flashcard-scene" onclick="flipCard()">
          <div class="flashcard-inner" id="card-inner">
            <!-- Mặt trước -->
            <div class="flashcard-face">
              <img id="card-img" src="" class="flashcard-img" />
              <h2 id="card-en" style="font-size: 2rem; color: var(--text-main)">
                Word
              </h2>
              <p style="margin-top: 10px; color: #999">(Chạm để lật)</p>
            </div>
            <!-- Mặt sau -->
            <div class="flashcard-face flashcard-back">
              <h2
                id="card-vn"
                style="font-size: 2rem; color: var(--primary-dark)"
              >
                Nghĩa
              </h2>
              <p
                id="card-topic"
                style="
                  margin-top: 15px;
                  background: white;
                  padding: 5px 15px;
                  border-radius: 10px;
                "
              >
                Topic
              </p>
            </div>
          </div>
        </div>

        <div
          style="
            text-align: center;
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
          "
        >
          <button class="btn btn-outline" onclick="prevCard()">⬅️ Trước</button>
          <span id="progress-text" style="align-self: center; font-weight: bold"
            >1/10</span
          >
          <button class="btn" onclick="nextCard()">Sau ➡️</button>
        </div>
      </div>

      <div
        id="empty-msg"
        style="text-align: center; color: #888; display: none"
      >
        <p>Chưa có từ vựng nào trong chủ đề này.</p>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/study.js"></script>
  </body>
</html>
